# Mapping rules: GIS intersection results → FORGE calculator input paths.
# Each rule takes a value from the intersection bag and writes it to a
# calculator input path. All MVP rules use the "direct" transform (value
# passes through unchanged as miles).

classification:
  default: scrubbed_flat
  slope:
    mountain_above_pct: 8.0
    rolling_hills_at_or_above_pct: 2.0
  # "slope" means the slope rule. Every other value is a terrain class.
  nlcd:
    11: slope
    12: mountain
    21: urban
    22: urban
    23: urban
    24: urban
    31: desert_barren
    41: forested
    42: forested
    43: forested
    81: farmland
    82: farmland
    90: forested
    95: slope
  wetland:
    stems: [PEM, PFO, PSS, E2EM, E2FO, E2SS]
    mixed: exclude

rules:
  # Terrain miles (8 categories, from NLCD + 3DEP slope crosswalk)
  - layer: "terrain/nlcd"
    key: "forested"
    forge_path: "02_project_physical_details.terrain.terrain_miles.forested"
    transform: "direct"

  - layer: "terrain/nlcd"
    key: "wetland"
    forge_path: "02_project_physical_details.terrain.terrain_miles.wetland"
    transform: "direct"

  - layer: "terrain/nlcd"
    key: "scrubbed_flat"
    forge_path: "02_project_physical_details.terrain.terrain_miles.scrubbed_flat"
    transform: "direct"

  - layer: "terrain/nlcd"
    key: "urban"
    forge_path: "02_project_physical_details.terrain.terrain_miles.urban"
    transform: "direct"

  - layer: "terrain/nlcd"
    key: "farmland"
    forge_path: "02_project_physical_details.terrain.terrain_miles.farmland"
    transform: "direct"

  - layer: "terrain/nlcd"
    key: "desert_barren"
    forge_path: "02_project_physical_details.terrain.terrain_miles.desert_barren"
    transform: "direct"

  - layer: "terrain/nlcd"
    key: "mountain"
    forge_path: "02_project_physical_details.terrain.terrain_miles.mountain"
    transform: "direct"

  - layer: "terrain/nlcd"
    key: "rolling_hills"
    forge_path: "02_project_physical_details.terrain.terrain_miles.rolling_hills"
    transform: "direct"

  # ROW zone miles (15 zones, from county → BLM zone crosswalk)
  - layer: "row/blm"
    key: "zone_1"
    forge_path: "11_project_row_details.right_of_way.zone_1.miles"
    transform: "direct"


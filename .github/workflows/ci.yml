# Checks on every push and pull request, then migrations.
# migrate-staging runs only on a push to main.
# migrate-production runs only on a push to release, in the production
# environment (required reviewer is configured on that environment, not here).
#
# ESLint (`npm run lint`) is omitted. static/ has pre-existing
# no-unsanitized/property errors, and this workflow should not block on them.
#
# Secrets:
#   SUPABASE_ACCESS_TOKEN          repository secret (migration jobs)
#   SUPABASE_PROJECT_REF           environment secret (staging, production)
#   SUPABASE_DB_PASSWORD           environment secret (staging, production)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v5
        with:
          version: "0.12.23"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Check lockfiles and lint Python
        run: |
          set -euo pipefail
          uv lock --check
          npm ci
          npm ls --all >/dev/null
          uv sync --frozen --extra dev
          uv run ruff check app/ tests/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v5
        with:
          version: "0.12.23"
      - name: Unit tests
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run pytest tests/unit/ -v

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Browser tests
        run: |
          set -euo pipefail
          npm ci
          npm test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v5
        with:
          version: "0.12.23"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: "2.90.0"
      - name: Start Supabase and apply migrations from scratch
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase start --yes \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api,mailpit
          supabase db reset --local --yes
      - name: pgTAP
        run: supabase test db
      - name: Integration tests
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/supabase.env"
          set +a
          api_url="${API_URL:-${SUPABASE_URL:-}}"
          anon_key="${ANON_KEY:-${SUPABASE_AUTH_ANON_KEY:-}}"
          service_key="${SERVICE_ROLE_KEY:-${SUPABASE_AUTH_SERVICE_ROLE_KEY:-}}"
          db_url="${DB_URL:-${SUPABASE_DB_URL:-}}"
          if [ -z "$api_url" ] || [ -z "$anon_key" ] || [ -z "$service_key" ] || [ -z "$db_url" ]; then
            echo "supabase status -o env did not include API, anon, service-role, and DB URL" >&2
            cut -d= -f1 "$RUNNER_TEMP/supabase.env" >&2
            exit 1
          fi
          export API_URL="$api_url"
          export DB_URL="$db_url"
          export SUPABASE_URL_TEST="$api_url"
          export SUPABASE_ANON_KEY_TEST="$anon_key"
          export SUPABASE_SERVICE_ROLE_KEY_TEST="$service_key"
          export SUPERUSER_DATABASE_URL_TEST="$db_url"
          export FORGE_DATABASE_URL_TEST="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse, urlunparse
          parsed = urlparse(os.environ["DB_URL"])
          if not parsed.hostname or not parsed.port:
              raise SystemExit("DB_URL is missing a host or port")
          netloc = f"forge_api:forge_api_local_dev_password@{parsed.hostname}:{parsed.port}"
          print(urlunparse((parsed.scheme, netloc, parsed.path or "/postgres", "", "", "")))
          PY
          )"
          uv sync --frozen --extra dev
          uv run pytest tests/integration/ -v

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: "2.90.0"
      - name: Build image
        run: docker build -t forge-webapp:ci .
      - name: Start local Supabase
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase start --yes \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api,mailpit
          supabase db reset --local --yes
      - name: Run container against the local stack
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/supabase.env"
          set +a
          api_url="${API_URL:-${SUPABASE_URL:-}}"
          anon_key="${ANON_KEY:-${SUPABASE_AUTH_ANON_KEY:-}}"
          db_url="${DB_URL:-${SUPABASE_DB_URL:-}}"
          if [ -z "$api_url" ] || [ -z "$anon_key" ] || [ -z "$db_url" ]; then
            echo "supabase status -o env did not include API, anon, and DB URL" >&2
            cut -d= -f1 "$RUNNER_TEMP/supabase.env" >&2
            exit 1
          fi
          export API_URL="$api_url"
          export ANON_KEY="$anon_key"
          export DB_URL="$db_url"
          forge_url="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse, urlunparse
          parsed = urlparse(os.environ["DB_URL"])
          if not parsed.hostname or not parsed.port:
              raise SystemExit("DB_URL is missing a host or port")
          netloc = f"forge_api:forge_api_local_dev_password@{parsed.hostname}:{parsed.port}"
          print(urlunparse((parsed.scheme, netloc, parsed.path or "/postgres", "", "", "")))
          PY
          )"
          docker run -d --name forge-ci --network host \
            -e SUPABASE_URL="$API_URL" \
            -e SUPABASE_ANON_KEY="$ANON_KEY" \
            -e FORGE_DATABASE_URL="$forge_url" \
            -e PORT=8000 \
            forge-webapp:ci
          ok=0
          for _ in $(seq 1 120); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8000/api/health || printf '000')"
            echo "health $code"
            if [ "$code" = "200" ]; then
              ok=1
              cat /tmp/health.json
              echo
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            docker logs forge-ci || true
            exit 1
          fi
      - name: Stop container
        if: always()
        run: docker rm -f forge-ci || true

  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Validate render.yaml against Render's schema
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml jsonschema
          python << 'PY'
          import json
          import urllib.request

          import yaml
          from jsonschema import Draft202012Validator

          with urllib.request.urlopen("https://render.com/schema/render.yaml.json", timeout=60) as response:
              schema = json.load(response)
          with open("render.yaml", encoding="utf-8") as handle:
              document = yaml.safe_load(handle)

          Draft202012Validator(schema).validate(document)

          services = document["services"]
          names = [service["name"] for service in services]
          if names != ["forge-staging", "forge-production"]:
              raise SystemExit(f"unexpected services: {names}")
          for service in services:
              if service["runtime"] != "docker":
                  raise SystemExit(f"{service['name']}: runtime must be docker")
              if service["healthCheckPath"] != "/api/health":
                  raise SystemExit(f"{service['name']}: healthCheckPath must be /api/health")
              if service["autoDeploy"] is not False:
                  raise SystemExit(f"{service['name']}: autoDeploy must be false")
              database = next(item for item in service["envVars"] if item["key"] == "FORGE_DATABASE_URL")
              if database.get("sync") is not False:
                  raise SystemExit(f"{service['name']}: FORGE_DATABASE_URL must use sync: false")
          print("render.yaml matches Render's schema")
          PY

  migrate-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit, browser, database, container, blueprint]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: "2.90.0"
      - name: Push migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
          supabase db push --yes

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [lint, unit, browser, database, container, blueprint]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: "2.90.0"
      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
          supabase db push --yes

# On-demand check of a deployed environment. Sets no commit status, so it
# never holds a deploy.
#
# Staging waits until /api/health reports expected_commit, then signs in as
# the smoke user, creates a scenario, checks its inputs_id against
# POST /api/forge/calculate, and deletes the scenario.
# Production checks health. When expected_commit is set, it also requires
# app_commit to match. It does not create a scenario.
#
# URL: the base_url input, or the APP_URL secret on the selected environment.
# Staging secrets: SMOKE_USER_EMAIL, SMOKE_USER_PASSWORD.
name: Smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to check
        required: true
        type: choice
        options:
          - staging
          - production
      expected_commit:
        description: Expected app_commit (RENDER_GIT_COMMIT). Required for staging.
        required: false
        default: ""
        type: string
      base_url:
        description: App base URL. Overrides the APP_URL secret for this environment.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      BASE_URL: ${{ inputs.base_url || secrets.APP_URL }}
      SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
      SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
    steps:
      - name: Check health and, on staging, a scenario round-trip
        run: |
          python3 << 'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          target = os.environ["TARGET_ENV"]
          expected = os.environ.get("EXPECTED_COMMIT", "").strip()
          base = os.environ.get("BASE_URL", "").strip().rstrip("/")
          email = os.environ.get("SMOKE_USER_EMAIL", "").strip()
          password = os.environ.get("SMOKE_USER_PASSWORD", "").strip()

          if target not in ("staging", "production"):
              sys.exit(f"unknown environment: {target}")
          if not base:
              sys.exit("Set the base_url input or the APP_URL secret for this environment.")
          if target == "staging" and not expected:
              sys.exit("staging requires expected_commit (RENDER_GIT_COMMIT / app_commit).")

          def request(method, url, payload=None, headers=None, timeout=60):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              if payload is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read()
                      return response.status, json.loads(raw.decode() or "null")
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      body = json.loads(raw.decode() or "null")
                  except json.JSONDecodeError:
                      body = raw.decode(errors="replace")
                  return exc.code, body
              except urllib.error.URLError as exc:
                  return 0, {"error": str(exc.reason)}

          deadline = time.time() + 15 * 60
          last = None
          commit = None
          while True:
              code, body = request("GET", f"{base}/api/health", timeout=20)
              last = (code, body)
              status = body.get("status") if isinstance(body, dict) else None
              commit = body.get("app_commit") if isinstance(body, dict) else None
              healthy = code == 200 and status == "ok"
              commit_ok = (not expected) or commit == expected
              print(f"health {code} app_commit={commit!r} status={status!r}", flush=True)
              if healthy and commit_ok:
                  break
              if time.time() >= deadline:
                  sys.exit(f"health did not match within 15 minutes; last={last!r}")
              time.sleep(10)

          print(f"{target} health ok app_commit={commit!r}")
          if target == "production":
              sys.exit(0)

          if not email or not password:
              sys.exit("staging smoke needs SMOKE_USER_EMAIL and SMOKE_USER_PASSWORD on the staging environment.")

          try:
              with urllib.request.urlopen(f"{base}/client-config.js", timeout=30) as response:
                  script = response.read().decode()
          except urllib.error.URLError as exc:
              sys.exit(f"GET /client-config.js failed: {exc}")
          url_match = re.search(r"window\.FORGE_SUPABASE_URL = (.*);", script)
          key_match = re.search(r"window\.FORGE_SUPABASE_KEY = (.*);", script)
          if not url_match or not key_match:
              sys.exit("client-config.js did not contain Supabase URL and key")
          supabase_url = json.loads(url_match.group(1)).rstrip("/")
          anon_key = json.loads(key_match.group(1))

          code, session = request(
              "POST",
              f"{supabase_url}/auth/v1/token?grant_type=password",
              {"email": email, "password": password},
              {"apikey": anon_key, "Authorization": f"Bearer {anon_key}"},
          )
          if code != 200 or not isinstance(session, dict) or "access_token" not in session:
              sys.exit(f"smoke sign-in failed: {code} {session!r}")
          auth = {"Authorization": f"Bearer {session['access_token']}"}

          code, defaults = request("GET", f"{base}/api/defaults")
          if code != 200 or not isinstance(defaults, dict):
              sys.exit(f"GET /api/defaults failed: {code} {defaults!r}")
          defaults_id = defaults["calculator"]["defaults_id"]
          changes = {"03_financing.financial.social_discount_rate": 0.05}
          payload = {
              "name": f"ci-smoke-{int(time.time())}",
              "source": "manual",
              "defaults_id": defaults_id,
              "changes": changes,
          }

          scenario_id = None
          try:
              code, created = request("POST", f"{base}/api/scenarios", payload, auth, timeout=180)
              if code != 201 or not isinstance(created, dict):
                  sys.exit(f"POST /api/scenarios failed: {code} {created!r}")
              scenario_id = created["id"]
              if created.get("calc_error") is not None or created.get("results") is None:
                  sys.exit(f"scenario was saved without results: {created.get('calc_error')!r}")

              code, preview = request(
                  "POST",
                  f"{base}/api/forge/calculate",
                  {"defaults_id": defaults_id, "changes": changes, "scenario_id": "ci-smoke"},
                  auth,
                  timeout=180,
              )
              if code != 200 or not isinstance(preview, dict):
                  sys.exit(f"POST /api/forge/calculate failed: {code} {preview!r}")
              preview_id = (preview.get("results") or {}).get("provenance", {}).get("inputs_id")
              if not preview_id or created.get("inputs_id") != preview_id:
                  sys.exit(
                      f"stored inputs_id {created.get('inputs_id')!r} != preview {preview_id!r}"
                  )
              print(f"scenario {scenario_id} inputs_id matches preview")
          finally:
              if scenario_id:
                  code, body = request("DELETE", f"{base}/api/scenarios/{scenario_id}", headers=auth)
                  if code != 204:
                      sys.exit(f"DELETE /api/scenarios/{scenario_id} failed: {code} {body!r}")
                  print(f"deleted scenario {scenario_id}")
          PY

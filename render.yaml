# Render Blueprint for FORGE staging and production.
# Placeholder Supabase URLs and anon keys are filled in the dashboard, or
# replaced here after those projects exist. FORGE_DATABASE_URL is a secret
# (sync: false): Render asks for it once, when the Blueprint is first created.
# autoDeploy stays false until CI is green, then switch to checksPass.
services:
  - type: web
    name: forge-staging
    runtime: docker
    repo: https://github.com/AndrewIgdal17/FORGE_WebApp
    branch: main
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: FORGE_ENV
        value: staging
      - key: SUPABASE_URL
        value: <staging-supabase-url>
      - key: SUPABASE_ANON_KEY
        value: <staging-anon-key>
      - key: FORGE_DATABASE_URL
        sync: false

  - type: web
    name: forge-production
    runtime: docker
    repo: https://github.com/AndrewIgdal17/FORGE_WebApp
    branch: release
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: FORGE_ENV
        value: production
      - key: SUPABASE_URL
        value: <production-supabase-url>
      - key: SUPABASE_ANON_KEY
        value: <production-anon-key>
      - key: FORGE_DATABASE_URL
        sync: false

# ============================================================================
# TERRAIN CROSSWALK (NLCD class → FORGE category)
#
# Used by the route analysis endpoint's raster sampling logic, not by the
# mapping rules engine. Included here as the canonical reference so the
# crosswalk and the mapping rules live in one versioned file.
#
# Precedence order (higher priority wins):
#   1. Subsea (construction type, not NLCD)
#   2. Wetland (NLCD 90, 95)
#   3. Forest (NLCD 41, 42, 43)
#   4. Urban (NLCD 21, 22, 23, 24)
#   5. Farmland (NLCD 81, 82)
#   6. Desert/barren (NLCD 31)
#   7. Mountain (slope > 8%, no land-cover claim above)
#   8. Rolling hills (slope 2–8%, no land-cover claim above)
#   9. Scrubbed flat (everything else)
# ============================================================================

terrain_crosswalk:
  nlcd_to_category:
    90: "wetland"        # Woody wetlands
    95: "wetland"        # Emergent herbaceous wetlands
    41: "forested"       # Deciduous forest
    42: "forested"       # Evergreen forest
    43: "forested"       # Mixed forest
    21: "urban"          # Developed, open space
    22: "urban"          # Developed, low intensity
    23: "urban"          # Developed, medium intensity
    24: "urban"          # Developed, high intensity
    81: "farmland"       # Hay/pasture
    82: "farmland"       # Cultivated crops
    31: "desert_barren"  # Barren land (rock/sand/clay)

  # NLCD classes not listed above fall through to slope-based classification:
  #   slope > 8%  → mountain
  #   slope 2–8%  → rolling_hills
  #   slope < 2%  → scrubbed_flat
  #
  # Common fall-through classes:
  #   52: Shrub/scrub
  #   71: Grassland/herbaceous
  #   11: Open water (should be excluded from route miles)
  #   12: Perennial ice/snow (mountain by WECC convention)

  slope_thresholds:
    mountain_min_pct: 8.0
    rolling_hills_min_pct: 2.0

  special_cases:
    # NLCD 12 (perennial ice/snow) → mountain regardless of slope
    12: "mountain"
    # NLCD 11 (open water) → excluded from terrain miles; flag for user review
    11: "exclude"

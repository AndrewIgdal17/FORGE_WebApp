# FORGE GIS → Calculator Mapping Rules
# v1, approved 2026-10-13
#
# These rules translate intersection results from the route analysis
# endpoint into FORGE calculator input field paths. Each rule maps one
# geographic measurement to one input field.
#
# Methodology note: these rules are methodology-adjacent — changing them
# changes what numbers the calculator sees, which changes results. They
# follow the same change discipline as methodology: document the rationale,
# test the effect. Crosswalk rationale is in:
#   Projects/FORGE/docs/design/2026-10-10__gis-route-drawing-design.md
#   § "Terrain crosswalk (v1, approved 2026-10-13)"
#
# Adding a new GIS layer = adding entries here. No calculator change needed.

# ============================================================================
# TERRAIN MILES (from NLCD + 3DEP slope crosswalk)
#
# The route analysis endpoint densifies the route to 30m points, samples
# NLCD land-cover class and 3DEP slope at each point, applies the precedence
# crosswalk (wetland > forest > urban > farmland > desert > mountain >
# rolling hills > scrubbed flat), and sums miles per category.
#
# The intersection results key is "terrain/nlcd_3dep".
# ============================================================================

terrain:
  - layer: "terrain/nlcd_3dep"
    key: "forested"
    forge_path: "02_project_physical_details.terrain.terrain_miles.forested"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "wetland"
    forge_path: "02_project_physical_details.terrain.terrain_miles.wetland"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "farmland"
    forge_path: "02_project_physical_details.terrain.terrain_miles.farmland"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "urban"
    forge_path: "02_project_physical_details.terrain.terrain_miles.urban"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "desert_barren"
    forge_path: "02_project_physical_details.terrain.terrain_miles.desert_barren"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "mountain"
    forge_path: "02_project_physical_details.terrain.terrain_miles.mountain"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "rolling_hills"
    forge_path: "02_project_physical_details.terrain.terrain_miles.rolling_hills"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "scrubbed_flat"
    forge_path: "02_project_physical_details.terrain.terrain_miles.scrubbed_flat"
    transform: "direct"
    unit: "miles"

  - layer: "terrain/nlcd_3dep"
    key: "subsea"
    forge_path: "02_project_physical_details.terrain.terrain_miles.subsea"
    transform: "direct"
    unit: "miles"


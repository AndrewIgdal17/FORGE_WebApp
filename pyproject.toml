[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-webapp"
version = "0.2.0"
description = "FORGE web application"
requires-python = ">=3.11"
dependencies = [
    "forge-calc @ git+https://github.com/AndrewIgdal17/FORGE.git@v2.1.6",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "PyJWT[crypto]>=2.8.0",
    "pyyaml>=6.0.0",
    "asyncpg>=0.29.0",
    "rasterio>=1.3",
    "scikit-learn>=1.8",
    "xgboost-cpu>=3.1",
    "jellyfish>=1.0",
]

[tool.setuptools.package-data]
app = ["*.yaml"]

[project.optional-dependencies]
dev = ["httpx", "pytest", "ruff"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "Depends"]

[tool.setuptools.packages.find]
include = ["app*"]

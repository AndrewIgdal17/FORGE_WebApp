[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-webapp"
version = "0.2.0"
description = "FORGE web application"
requires-python = ">=3.11"
dependencies = [
    "forge-calc @ git+https://github.com/AndrewIgdal17/FORGE.git@v1.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "PyJWT[crypto]>=2.8.0",
    "pyyaml>=6.0.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[tool.setuptools.packages.find]
include = ["app*"]
